    <script>
      (function(){
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var trackParams = ['gclid', 'wbraid', 'gbraid', 'fbclid', 'utm_source', 'utm_medium', 'utm_campaign'];
          
          // 1. Armazenar parâmetros da URL permanentemente no LocalStorage
          trackParams.forEach(function(param) {
            if(urlParams.has(param)) {
              localStorage.setItem('lk_track_' + param, urlParams.get(param));
            }
          });

          var getCookie = function(name) {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
          };
          
          var setCookie = function(name, value, days) {
            var date = new Date();
            date.setTime(date.getTime() + (days*24*60*60*1000));
            document.cookie = name + "=" + value + "; expires=" + date.toUTCString() + "; path=/";
          };

          // 2. Motor de Ressurreição de Cookies (FBP / FBC / Google Analytics)
          // Se o iPhone do cliente deletou o cookie do Facebook de ontem, nós o recriamos a partir do LocalStorage
          var metaCookies = ['_fbp', '_fbc', '_ga'];
          metaCookies.forEach(function(c) {
             var cookieVal = getCookie(c);
             if(cookieVal) {
                // Salva o cookie fresco no vault
                localStorage.setItem('lk_vault_' + c, cookieVal);
             } else {
                // Ressuscita o cookie morto (90 dias de vida útil forçada)
                var storedVal = localStorage.getItem('lk_vault_' + c);
                if(storedVal) {
                  setCookie(c, storedVal, 90);
                }
             }
          });
        } catch(e) {}
      })();
    </script>
